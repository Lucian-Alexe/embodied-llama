<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <defs>
    <!-- 4-pointed sparkle star -->
    <g id="sparkle-lg">
      <path d="M 0,-10 C 1,-3 3,-1 10,0 C 3,1 1,3 0,10 C -1,3 -3,1 -10,0 C -3,-1 -1,-3 0,-10 Z" fill="#b58c5c" opacity="0.18" />
    </g>
    <g id="sparkle-sm">
      <path d="M 0,-6 C 0.6,-1.8 1.8,-0.6 6,0 C 1.8,0.6 0.6,1.8 0,6 C -0.6,1.8 -1.8,0.6 -6,0 C -1.8,-0.6 -0.6,-1.8 0,-6 Z" fill="#b58c5c" opacity="0.14" />
    </g>
    <!-- Tiny celestial dot -->
    <circle id="dot" r="1.2" fill="#b58c5c" opacity="0.12" />
  </defs>

  <!-- Starry pattern layout -->
  <use href="#sparkle-lg" x="24" y="24" />
  <use href="#sparkle-sm" x="84" y="36" />
  <use href="#sparkle-lg" x="96" y="96" />
  <use href="#sparkle-sm" x="36" y="84" />
  <use href="#dot" x="60" y="14" />
  <use href="#dot" x="60" y="60" />
  <use href="#dot" x="12" y="108" />
  <use href="#dot" x="108" y="12" />
  <use href="#dot" x="110" y="70" />
</svg>

